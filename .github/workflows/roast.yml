name: RoastMyCode PR review

# Native GitHub Actions PR code review inspired by RoastMyCode.ai
# (https://github.com/marketplace/roastmycode-ai).
#
# WHY THIS EXISTS
#
# `aislop.yml` enforces deterministic static rules (swallowed exceptions,
# unused imports, oversized files). This workflow complements it with an
# AI staff-engineer review on every pull request: a calibrated letter grade
# (A+ through F), 0-100 scores across six categories (Security, Architecture,
# Bugs, Performance, Dependencies, Code Quality), specific line-referenced
# burns, concrete fix snippets, and a Redemption Arc.
#
# HOW IT WORKS
#
# 1. Explorer (`.github/roast/cli.mjs prepare`) — inspects the PR diff, skips
#    committed minified bundles (`index-*.js`, `store-*.css`, etc.), lockfiles
#    and binary media so token budget goes to hand-authored code, and prefixes
#    each diff hunk with exact target line numbers (`+L42:`).
# 2. Roaster (`actions/ai-inference@v2`) — calls GitHub Models using the
#    built-in `GITHUB_TOKEN` (`models: read`); no repository secrets required.
# 3. Scorer & Verifier (`.github/roast/cli.mjs render`) — drops hallucinated
#    file paths not in the PR diff, calibrates the overall grade from the six
#    category scores (capping grades when high-severity bug/security findings
#    exist), sanitizes untrusted model text, writes the report to the Actions
#    job summary, and creates or updates a single sticky PR comment in place.
#
# MANUAL DISPATCH
#
#   gh workflow run roast.yml -f pr=172
#   gh workflow run roast.yml -f pr=172 -f heat=inferno
#   gh workflow run roast.yml -f base_ref=main -f heat=nuclear   # summary-only

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to roast (leave blank to diff HEAD against base_ref in job summary)
        required: false
        default: ''
        type: string
      base_ref:
        description: Base branch when `pr` is blank
        required: false
        default: main
        type: string
      heat:
        description: Roast heat level
        required: false
        default: medium-rare
        type: choice
        options:
          - gentle
          - medium-rare
          - inferno
          - nuclear
      model:
        description: GitHub Models identifier
        required: false
        default: openai/gpt-4o
        type: string
      post_comment:
        description: Post/update comment on the pull request when `pr` is provided
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: roast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  roast:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      models: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Self-test roast engine
        run: node --test .github/roast/pr-roast.test.mjs

      - name: Resolve pull request target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_POST_COMMENT: ${{ inputs.post_comment }}
        run: |
          set -euo pipefail
          meta_dir="$RUNNER_TEMP/roast-target"
          mkdir -p "$meta_dir"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            pr_number="$EVENT_PR_NUMBER"
            base_sha="$EVENT_BASE_SHA"
            head_sha="$EVENT_HEAD_SHA"
            printf '%s' "$EVENT_PR_TITLE" > "$meta_dir/title.txt"
            printf '%s' "$EVENT_PR_BODY" > "$meta_dir/body.txt"
            if [ "$EVENT_HEAD_REPO" = "$REPO" ]; then
              can_comment="true"
            else
              can_comment="false"
            fi
          elif [ -n "$INPUT_PR" ]; then
            if ! [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
              echo "Invalid PR number: $INPUT_PR" >&2
              exit 1
            fi
            pr_number="$INPUT_PR"
            pr_json=$(gh pr view "$pr_number" --repo "$REPO" --json baseRefOid,headRefOid,title,body)
            base_sha=$(printf '%s' "$pr_json" | jq -r '.baseRefOid')
            head_sha=$(printf '%s' "$pr_json" | jq -r '.headRefOid')
            printf '%s' "$pr_json" | jq -r '.title // ""' > "$meta_dir/title.txt"
            printf '%s' "$pr_json" | jq -r '.body // ""' > "$meta_dir/body.txt"
            git fetch --no-tags origin "refs/pull/$pr_number/head"
            if [ "$INPUT_POST_COMMENT" = "true" ]; then
              can_comment="true"
            else
              can_comment="false"
            fi
          else
            pr_number=""
            base_ref="${INPUT_BASE_REF:-main}"
            if ! [[ "$base_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$base_ref" == -* ]]; then
              echo "Invalid base_ref: $base_ref" >&2
              exit 1
            fi
            base_sha=$(git rev-parse "origin/$base_ref")
            head_sha=$(git rev-parse HEAD)
            git log -1 --pretty=%s > "$meta_dir/title.txt"
            git log -1 --pretty=%b > "$meta_dir/body.txt"
            can_comment="false"
          fi

          {
            echo "pr_number=$pr_number"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "can_comment=$can_comment"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare diff and prompt
        id: prepare
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          HEAT_LEVEL: ${{ inputs.heat || 'medium-rare' }}
          OUT_SYSTEM_FILE: ${{ runner.temp }}/roast-system.txt
          OUT_PROMPT_FILE: ${{ runner.temp }}/roast-prompt.txt
          OUT_META_FILE: ${{ runner.temp }}/roast-meta.json
        run: |
          set -euo pipefail
          PR_TITLE=$(cat "$RUNNER_TEMP/roast-target/title.txt") \
          PR_BODY=$(cat "$RUNNER_TEMP/roast-target/body.txt") \
          node .github/roast/cli.mjs prepare

      - name: Run AI inference
        id: inference
        if: steps.prepare.outputs.skip_inference != 'true'
        uses: actions/ai-inference@v2
        with:
          model: ${{ inputs.model || 'openai/gpt-4o' }}
          system-prompt-file: ${{ runner.temp }}/roast-system.txt
          prompt-file: ${{ runner.temp }}/roast-prompt.txt
          max-completion-tokens: '2200'
          temperature: '0.4'

      - name: Render and publish roast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          CAN_COMMENT: ${{ steps.target.outputs.can_comment }}
          SKIP_INFERENCE: ${{ steps.prepare.outputs.skip_inference }}
          MODEL_NAME: ${{ inputs.model || 'openai/gpt-4o' }}
          META_FILE: ${{ runner.temp }}/roast-meta.json
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
          MODEL_RESPONSE: ${{ steps.inference.outputs.response }}
          OUT_MARKDOWN_FILE: ${{ runner.temp }}/roast-comment.md
        run: |
          set -euo pipefail
          node .github/roast/cli.mjs render
          cat "$OUT_MARKDOWN_FILE" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CAN_COMMENT" != "true" ] || [ -z "$PR_NUMBER" ]; then
            echo "Summary written; PR comment skipped (can_comment=$CAN_COMMENT, pr=$PR_NUMBER)."
            exit 0
          fi

          existing_id=$(
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-roast-comment -->"))) | .id' \
              | head -n 1 || true
          )

          if [ -n "$existing_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing_id" \
              -F body=@"$OUT_MARKDOWN_FILE" >/dev/null
            echo "Updated existing PR roast comment #$existing_id on PR #$PR_NUMBER."
          elif [ "$SKIP_INFERENCE" != "true" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$OUT_MARKDOWN_FILE"
            echo "Posted new PR roast comment on PR #$PR_NUMBER."
          else
            echo "Skipped creating a new PR comment because only generated/binary files changed."
          fi
