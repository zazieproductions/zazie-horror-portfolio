name: mobile-audit (temporary)

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install playwright
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          ALLOW_EMBED=1 PORT=8080 node server.mjs > /tmp/server.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/
      - name: Capture
        continue-on-error: true
        run: |
          set +e
          node .mobile-audit/shots.mjs 2>&1 | tail -40
          node .mobile-audit/probe.mjs 2>&1 | tail -20
          node .mobile-audit/menu.mjs 2>&1 | tail -40
          node .mobile-audit/probe2.mjs 2>&1 | tail -20
          node .mobile-audit/whichimg.mjs 2>&1 | tail -20
          echo "capture finished (non-fatal)" 
      - name: Commit captures back to the branch
        if: always()
        run: |
          git config user.name 'mobile audit'
          git config user.email 'audit@zazie.local'
          git add -f .mobile-audit/out .mobile-audit/out2 .mobile-audit/out3 .mobile-audit/probe.json
          git commit -m 'chore(audit): mobile captures [skip ci]' || echo 'nothing to commit'
          git push origin HEAD:${GITHUB_REF_NAME}
