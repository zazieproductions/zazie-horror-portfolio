name: mobile-audit (temporary)

on:
  push:
    branches:
      - 'arena/**'

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install playwright
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          ALLOW_EMBED=1 PORT=8080 node server.mjs > /tmp/server.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/
      - name: Capture
        run: node .mobile-audit/shots.mjs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit
          path: .mobile-audit/out
          retention-days: 7
