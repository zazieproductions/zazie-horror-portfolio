# This workflow uses an action that is not certified by GitHub.
# It is provided by a third-party and is governed by separate terms of
# service, privacy policy, and support documentation.
#
# Lighthouse audit for the published horror.zazieproductions.com site.
# Uses treosh/lighthouse-ci-action (GitHub Marketplace: "Lighthouse CI
# Action"), which runs Google Lighthouse (via Lighthouse CI) against a URL
# on the runner's preinstalled Chrome and uploads the HTML and JSON reports
# as a workflow artifact. The step after it prints the Performance,
# Accessibility, Best Practices and SEO scores (out of 100) to the job summary.
#
# Source: https://github.com/treosh/lighthouse-ci-action
# Marketplace: https://github.com/marketplace/actions/lighthouse-ci-action
# Pinned release: 12.6.2 (bundles Lighthouse 12.6, runs on node24)
#
# WHY NOT jakejarvis/lighthouse-action
#
# That action (last release v0.3.2) is unmaintained. Its Docker image runs an
# old Node and `npm install -g lighthouse` with no version pin, so every image
# build pulled a Lighthouse that no longer runs on that Node and crashed with
# `ERR_MODULE_NOT_FOUND: Cannot find package 'timers'`. It also declared no
# inputs (hence the "Unexpected input(s) 'url'" warning) and parsed the `pwa`
# category, which Lighthouse 12 removed. Pinning the tag cannot fix it: the
# Lighthouse version is resolved when the image is built, not by the tag.
#
# Nothing needs to be installed in the job. It audits a live, reachable URL --
# this repo's production site is not a PR preview, so unmerged changes are
# not audited here; the deploy workflow (deploy.yml) already runs the live
# route audit against whatever was just deployed.
#
# Note: the site serves crawlers, headless clients and Lighthouse the static,
# no-bundle path (see PERFORMANCE.md, `ZP_RUNTIME_BOT`), so these scores
# describe that path, not the idle-loaded React mount human visitors get.
#
# TRIGGERS
#   push to main        audit the live production site after it ships
#   schedule            weekly regression check (Sundays 06:00 UTC)
#   workflow_dispatch   audit any URL, e.g. a deploy preview
#
#   gh workflow run lighthouse.yml
#   gh workflow run lighthouse.yml -f url=https://<hash>.pages.dev

name: Lighthouse audit

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit (defaults to the production site)
        required: false
        default: https://horror.zazieproductions.com
        type: string

permissions:
  contents: read

concurrency:
  group: lighthouse-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse audit
        id: lighthouse
        # Pin to a release; bump after reviewing the action's releases:
        # https://github.com/treosh/lighthouse-ci-action/releases
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: ${{ inputs.url || 'https://horror.zazieproductions.com' }}
          # Three runs; Lighthouse CI picks the median as the representative
          # run, which damps network noise on a live-site audit.
          runs: 3
          # Uploads every run's HTML + JSON report (.lighthouseci/) as the
          # `lighthouse-report` artifact -- replaces the separate
          # actions/upload-artifact step the old action needed.
          uploadArtifacts: true
          artifactName: lighthouse-report

      - name: Lighthouse scores
        if: always() && steps.lighthouse.outputs.resultsPath != ''
        env:
          RESULTS_PATH: ${{ steps.lighthouse.outputs.resultsPath }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { join } from "node:path";
            const manifest = JSON.parse(readFileSync(join(process.env.RESULTS_PATH, "manifest.json"), "utf8"));
            const cats = [["performance", "Performance"], ["accessibility", "Accessibility"], ["best-practices", "Best Practices"], ["seo", "SEO"]];
            const fmt = (s) => (typeof s === "number" ? String(Math.round(s * 100)) : "n/a");
            const lines = ["### Lighthouse", "", "| URL | " + cats.map(([, l]) => l).join(" | ") + " |", "|---|" + cats.map(() => "---:").join("|") + "|"];
            for (const run of manifest.filter((r) => r.isRepresentativeRun)) {
              lines.push("| " + run.url + " | " + cats.map(([k]) => fmt(run.summary[k])).join(" | ") + " |");
            }
            lines.push("", "Representative (median) run of " + manifest.length + ". Full HTML/JSON reports: the `lighthouse-report` artifact.");
            const out = lines.join("\n") + "\n";
            process.stdout.write(out);
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          '
