name: Deploy to Cloudflare Pages

# Ship the site, and prove it shipped.
#
# WHY THIS EXISTS
#
# The served tree is the repository root -- "what is on main is what the edge
# serves" -- but main has repeatedly drifted ahead of the edge. On 2026-09-24
# the repo was rolled back to commit 9e79fc2 because nothing merged after PR #47
# had ever deployed; the workflow meant to deploy it (.github/workflows/main.yml)
# failed on every run, "npm ci requires a package.json the repo does not have".
# As of 2026-10-04 the edge was five hours and six merges behind again.
#
# So: validate the tree, upload only the site (see
# scripts/build-deploy-dir.mjs -- the git integration publishes tools/, src/,
# the markdown docs and server.mjs too), then run the live route audit against
# what was just deployed. A deploy that does not serve its own sitemap fails
# here rather than silently.
#
# SETUP (once)
#
#   CLOUDFLARE_API_TOKEN   repo secret   Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  repo secret   the account owning the Pages project
#
# Until both exist the job does nothing beyond printing a warning, so merging
# this file is safe before the secrets are in place.
#
#   gh workflow run deploy.yml                                  # production
#   gh workflow run deploy.yml -f environment=preview           # preview URL

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      project:
        description: Cloudflare Pages project name
        required: true
        default: zazie-horror-portfolio
        type: string
      verify_live:
        description: Run the live route audit after deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ inputs.project || 'zazie-horror-portfolio' }}
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
      BASE_URL: https://horror.zazieproductions.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Credentials present?
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nothing deployed::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set. Add them as repository secrets (Pages:Edit token, and the account id that owns the Pages project), then re-run."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # Everything below is a gate the deploy has to pass. The generated pages
      # are committed, so these run against the tree exactly as it will ship.
      - name: Validate
        if: steps.creds.outputs.ok == 'true'
        run: |
          node scripts/tsc.mjs
          node tools/check-sitemap.mjs
          node scripts/attach-item-markers.mjs --check
          node tools/route-aliases.mjs --check

      - name: Store assets (sw.js hash drift is fatal)
        if: steps.creds.outputs.ok == 'true'
        run: |
          ./store-src/build.sh 2> store-build.err
          if grep -q WARNING store-build.err; then
            echo "sw.js and the store build disagree:"
            cat store-build.err
            exit 1
          fi
          rm -f store-build.err
          # A build that changes the tree means the committed output was stale.
          git diff --exit-code -- store.html store/index.html 'store-*.css' 'store-*.js' sw.js \
            || { echo "store build changed the tree; run ./store-src/build.sh and commit"; exit 1; }

      - name: Assemble the upload
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/build-deploy-dir.mjs dist

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=(dist --project-name "$PROJECT")
          [ "$ENVIRONMENT" = "production" ] && args+=(--branch main)
          npx --yes "wrangler@^4" pages deploy "${args[@]}"

      - name: Live route audit
        if: ${{ steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || (inputs.verify_live && inputs.environment == 'production')) }}
        run: |
          sleep 45
          node tools/live-route-audit.mjs "$BASE_URL"

      - name: Not deployed
        if: steps.creds.outputs.ok != 'true'
        run: echo "Skipped: no Cloudflare credentials. This run changed nothing at the edge."
