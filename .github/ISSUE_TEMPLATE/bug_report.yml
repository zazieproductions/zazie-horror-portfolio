name: Bug report
description: Something on the site or in the build is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes: { label: URL or command, description: "Page URL, or the exact command that failed" }
    validations: { required: true }
  - type: textarea
    id: detail
    attributes: { label: What happened, description: "Expected vs actual; browser/Node version if relevant" }
    validations: { required: true }
